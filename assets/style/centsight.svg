<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b7db1"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>

  <text x="40" y="58" fill="#ffffff" font-size="30" font-weight="700">CentSight</text>
  <text x="40" y="86" fill="#8aa0c8" font-size="16">Full-stack personal finance app with bank and card sync</text>

  <!-- AWS boundary -->
  <rect x="215" y="120" width="300" height="250" rx="12" fill="none" stroke="#ED8B00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="230" y="142" fill="#ED8B00" font-size="12" font-weight="700">AWS · provisioned with Terraform</text>

  <!-- React PWA -->
  <g>
    <rect x="40" y="160" width="130" height="80" rx="10" fill="#22243f" stroke="#3a3f66" stroke-width="1.5"/>
    <text x="105" y="193" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">React PWA</text>
    <text x="105" y="214" fill="#8aa0c8" font-size="11" text-anchor="middle">mobile-first UI</text>
  </g>

  <!-- Spring Boot API -->
  <g>
    <rect x="290" y="160" width="150" height="80" rx="10" fill="#22243f" stroke="#3a3f66" stroke-width="1.5"/>
    <text x="365" y="190" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Spring Boot</text>
    <text x="365" y="210" fill="#8aa0c8" font-size="11" text-anchor="middle">REST APIs</text>
    <text x="365" y="224" fill="#8aa0c8" font-size="11" text-anchor="middle">OAuth2 sign-in</text>
  </g>

  <!-- PostgreSQL -->
  <g>
    <rect x="290" y="280" width="150" height="70" rx="10" fill="#22243f" stroke="#57d131" stroke-width="1.5"/>
    <text x="365" y="308" fill="#57d131" font-size="14" font-weight="700" text-anchor="middle">PostgreSQL</text>
    <text x="365" y="328" fill="#8aa0c8" font-size="11" text-anchor="middle">encrypted access tokens</text>
  </g>

  <!-- Plaid -->
  <g>
    <rect x="590" y="160" width="160" height="80" rx="10" fill="#22243f" stroke="#3a3f66" stroke-width="1.5"/>
    <text x="670" y="193" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Plaid</text>
    <text x="670" y="214" fill="#8aa0c8" font-size="11" text-anchor="middle">bank &amp; card data</text>
  </g>

  <!-- arrows -->
  <line x1="172" y1="200" x2="286" y2="200" stroke="#5b7db1" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <text x="229" y="192" fill="#8aa0c8" font-size="11" text-anchor="middle">HTTPS</text>
  <line x1="442" y1="200" x2="586" y2="200" stroke="#5b7db1" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <text x="550" y="192" fill="#8aa0c8" font-size="11" text-anchor="middle">sync</text>
  <line x1="365" y1="242" x2="365" y2="276" stroke="#5b7db1" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <g font-size="12" fill="#8aa0c8">
    <rect x="40" y="408" width="720" height="0.6" fill="#3a3f66"/>
    <text x="40" y="432">Java</text>
    <text x="95" y="432">·  Spring Boot</text>
    <text x="200" y="432">·  React</text>
    <text x="265" y="432">·  PostgreSQL</text>
    <text x="365" y="432">·  Plaid</text>
    <text x="420" y="432">·  OAuth2</text>
    <text x="490" y="432">·  Terraform</text>
  </g>
</svg>
